name: Docker Build & GHCR Registry Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t intelligent-hospital-queue-backend .

      - name: Build Frontend Docker Image
        run: |
          docker build -t intelligent-hospital-queue-frontend ./frontend

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Backend Image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}/backend
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          docker tag intelligent-hospital-queue-backend $IMAGE_ID:latest
          docker tag intelligent-hospital-queue-backend $IMAGE_ID:v1.0.0
          docker push $IMAGE_ID:latest
          docker push $IMAGE_ID:v1.0.0

      - name: Push Frontend Image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}/frontend
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          docker tag intelligent-hospital-queue-frontend $IMAGE_ID:latest
          docker tag intelligent-hospital-queue-frontend $IMAGE_ID:v1.0.0
          docker push $IMAGE_ID:latest
          docker push $IMAGE_ID:v1.0.0
