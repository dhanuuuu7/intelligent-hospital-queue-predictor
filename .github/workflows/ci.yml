name: Backend CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Model Artifacts Exist
        run: |
          python -c "import os; assert os.path.exists('models/artifacts/final_waiting_time_model.joblib'), 'Model artifact missing!'"

      - name: Run Pytest Test Suite
        run: |
          python -m pytest -v -s tests/

      - name: Run Inference Smoke Test
        run: |
          python -c "from models.predict import predict_waiting_time; print('Smoke Test Prediction:', predict_waiting_time({'department_name': 'General Medicine', 'day_of_week': 1, 'hour_of_day': 10, 'is_weekend_or_holiday': 0, 'season_indicator': 'Winter', 'queue_position': 5, 'scheduled_patients_ahead': 3, 'walkin_patients_ahead': 2, 'patient_arrival_type': 'Scheduled', 'patient_case_complexity': 'Low', 'active_doctors_count': 4, 'doctors_on_break_count': 0, 'triage_staff_count': 2, 'shift_handover_flag': 0, 'emergency_cases_active': 0, 'arrival_rate_past_30min': 10.0, 'recent_throughput_past_hour': 20, 'avg_waiting_time_last_30min': 12.0, 'dept_service_time_variability': 3.0, 'hospital_occupancy_rate': 0.65}))"
